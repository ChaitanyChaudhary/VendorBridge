services:
  postgres:
    image: postgres:16-alpine
    container_name: vendorbridge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vendorbridge
      POSTGRES_PASSWORD: vendorbridge
      POSTGRES_DB: vendorbridge
    volumes:
      - vendorbridge_pgdata:/var/lib/postgresql/data

volumes:
  vendorbridge_pgdata:
